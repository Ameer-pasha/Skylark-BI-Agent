{% extends "base.html" %}
{% block title %}Student Management · Smart Attendance{% endblock %}
{% block heading %}Student Management{% endblock %}

{% block content %}
<!-- ═══ Toolbar ═══ -->
<div class="card p-4 md:p-5">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div class="grid flex-1 grid-cols-1 gap-3 sm:grid-cols-2">
      <div>
        <label class="label" for="stu-search">Search</label>
        <input id="stu-search" class="input" type="text" placeholder="Name or roll number…" />
      </div>
      <div>
        <label class="label" for="stu-class">Class / Section</label>
        <select id="stu-class" class="select"><option value="">All classes</option></select>
      </div>
    </div>
    <a href="/register" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Student
    </a>
  </div>
</div>

<!-- ═══ Grid ═══ -->
<div class="mt-6">
  <div class="mb-3 flex items-center justify-between">
    <h3 class="text-base font-bold">Registered Students</h3>
    <span id="stu-count" class="text-xs font-semibold text-slate-400">–</span>
  </div>
  <div id="students-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    <div class="skeleton h-40"></div><div class="skeleton h-40"></div>
    <div class="skeleton h-40"></div><div class="skeleton h-40"></div>
  </div>
</div>

<!-- ═══ Edit modal ═══ -->
<div id="edit-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="modal-backdrop"></div>
  <div class="relative w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900 match-card">
    <h3 class="mb-4 text-lg font-bold">Edit Student</h3>
    <form id="edit-form" class="space-y-4">
      <input type="hidden" id="edit-id" />
      <div><label class="label">Full Name</label><input id="edit-name" class="input" required /></div>
      <div><label class="label">Roll Number</label><input id="edit-roll" class="input" required /></div>
      <div><label class="label">Class / Section</label><input id="edit-class" class="input" required /></div>
      <div class="flex gap-3 pt-2">
        <button type="button" id="btn-cancel-edit" class="btn btn-ghost flex-1">Cancel</button>
        <button type="submit" class="btn btn-primary flex-1">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.body.dataset.page = "students";

const grid = document.getElementById("students-grid");
const countEl = document.getElementById("stu-count");
const searchEl = document.getElementById("stu-search");
const classEl = document.getElementById("stu-class");
const modal = document.getElementById("edit-modal");

let allStudents = [];

function avatar(s) {
  if (s.photo_url) return `<img src="${s.photo_url}" class="h-16 w-16 rounded-2xl object-cover ring-2 ring-indigo-500/20" alt="">`;
  return `<div class="grid h-16 w-16 place-items-center rounded-2xl gradient-bg text-2xl font-extrabold text-white">${App.escapeHtml((s.name || "?").charAt(0).toUpperCase())}</div>`;
}

function render(list) {
  countEl.textContent = `${list.length} student${list.length === 1 ? "" : "s"}`;
  if (!list.length) {
    grid.innerHTML = `<div class="col-span-full card p-12 text-center text-slate-400">
      <div class="mx-auto mb-3 grid h-14 w-14 place-items-center rounded-2xl bg-slate-100 dark:bg-slate-800 text-2xl">🎓</div>
      <p class="font-semibold">No students found</p>
      <p class="text-sm">Register a student to get started.</p>
    </div>`;
    return;
  }
  grid.innerHTML = list.map((s) => `
    <div class="card card-hover group p-5">
      <div class="flex items-start gap-4">
        ${avatar(s)}
        <div class="min-w-0 flex-1">
          <p class="truncate font-bold">${App.escapeHtml(s.name)}</p>
          <p class="truncate text-xs text-slate-400">${App.escapeHtml(s.roll_no)}</p>
          <span class="mt-2 inline-block rounded-full bg-indigo-500/10 px-2.5 py-1 text-[11px] font-bold text-indigo-600 dark:text-indigo-400">${App.escapeHtml(s.class_section)}</span>
        </div>
      </div>
      <div class="mt-4 flex gap-2">
        <button class="btn btn-ghost flex-1 !px-2 !py-1.5 text-xs" onclick="openEdit(${s.id})">✏️ Edit</button>
        <button class="btn btn-ghost flex-1 !px-2 !py-1.5 text-xs !text-rose-500 hover:!bg-rose-500/10" onclick="removeStudent(${s.id}, '${App.escapeHtml(s.name)}')">🗑 Delete</button>
      </div>
    </div>`).join("");
}

async function loadStudents() {
  grid.innerHTML = `<div class="skeleton h-40"></div><div class="skeleton h-40"></div><div class="skeleton h-40"></div><div class="skeleton h-40"></div>`;
  try {
    const data = await App.apiFetch("/api/students");
    allStudents = data.students || [];
    applyFilters();
    // populate class filter
    const classes = [...new Set(allStudents.map((s) => s.class_section).filter(Boolean))].sort();
    const current = classEl.value;
    classEl.innerHTML = '<option value="">All classes</option>' +
      classes.map((c) => `<option value="${App.escapeHtml(c)}">${App.escapeHtml(c)}</option>`).join("");
    classEl.value = current;
  } catch (err) { App.toast(err.message, "error"); }
}

function applyFilters() {
  const q = searchEl.value.trim().toLowerCase();
  const c = classEl.value;
  const filtered = allStudents.filter((s) => {
    const matchQ = !q || (s.name + " " + s.roll_no).toLowerCase().includes(q);
    const matchC = !c || s.class_section === c;
    return matchQ && matchC;
  });
  render(filtered);
}

searchEl.addEventListener("input", App.debounce(applyFilters, 300));
classEl.addEventListener("change", applyFilters);

/* ── Delete ── */
window.removeStudent = async function (id, name) {
  if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
  try {
    const res = await App.apiFetch(`/api/students/${id}`, { method: "DELETE" });
    App.toast(res.message || "Student deleted", "success");
    loadStudents();
  } catch (err) { App.toast(err.message, "error"); }
};

/* ── Edit ── */
window.openEdit = function (id) {
  const s = allStudents.find((x) => x.id === id);
  if (!s) return;
  document.getElementById("edit-id").value = s.id;
  document.getElementById("edit-name").value = s.name;
  document.getElementById("edit-roll").value = s.roll_no;
  document.getElementById("edit-class").value = s.class_section;
  modal.classList.remove("hidden");
  modal.classList.add("flex");
};
function closeModal() { modal.classList.add("hidden"); modal.classList.remove("flex"); }
document.getElementById("btn-cancel-edit").addEventListener("click", closeModal);
document.getElementById("modal-backdrop").addEventListener("click", closeModal);

document.getElementById("edit-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("edit-id").value;
  const payload = {
    name: document.getElementById("edit-name").value.trim(),
    roll_no: document.getElementById("edit-roll").value.trim(),
    class_section: document.getElementById("edit-class").value.trim(),
  };
  try {
    const res = await App.apiFetch(`/api/students/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    App.toast(res.message || "Student updated", "success");
    closeModal();
    loadStudents();
  } catch (err) { App.toast(err.message, "error"); }
});

loadStudents();
</script>
{% endblock %}
