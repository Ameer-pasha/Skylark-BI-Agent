{% extends "base.html" %}
{% block title %}Attendance Records · Smart Attendance{% endblock %}
{% block heading %}Attendance Records{% endblock %}

{% block content %}
<!-- ═══ Filters ═══ -->
<div class="card p-4 md:p-5">
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5">
    <div>
      <label class="label" for="filter-date">Date</label>
      <input type="date" id="filter-date" class="input" />
    </div>
    <div>
      <label class="label" for="filter-class">Class / Section</label>
      <select id="filter-class" class="select">
        <option value="">All classes</option>
      </select>
    </div>
    <div class="lg:col-span-2">
      <label class="label" for="filter-search">Search</label>
      <input id="filter-search" class="input" type="text" placeholder="Search name or roll number…" />
    </div>
    <div class="flex items-end gap-2">
      <button id="btn-export" class="btn btn-primary flex-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
    </div>
  </div>
</div>

<!-- ═══ Table ═══ -->
<div class="card mt-6 overflow-hidden p-0">
  <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4 dark:border-slate-800">
    <h3 class="text-base font-bold">Records</h3>
    <span id="record-count" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-500 dark:bg-slate-800 dark:text-slate-400">–</span>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full min-w-[640px] text-left text-sm">
      <thead>
        <tr class="border-b border-slate-100 text-xs uppercase tracking-wide text-slate-400 dark:border-slate-800">
          <th class="px-5 py-3 font-semibold">Student</th>
          <th class="px-5 py-3 font-semibold">Roll No</th>
          <th class="px-5 py-3 font-semibold">Class</th>
          <th class="px-5 py-3 font-semibold">Date</th>
          <th class="px-5 py-3 font-semibold">Time</th>
          <th class="px-5 py-3 font-semibold">Status</th>
        </tr>
      </thead>
      <tbody id="records-body">
        <tr><td colspan="6" class="px-5 py-8">
          <div class="space-y-2"><div class="skeleton h-10"></div><div class="skeleton h-10"></div><div class="skeleton h-10"></div><div class="skeleton h-10"></div><div class="skeleton h-10"></div></div>
        </td></tr>
      </tbody>
    </table>
  </div>
  <div class="flex items-center justify-between border-t border-slate-100 px-5 py-3 dark:border-slate-800">
    <button id="btn-prev" class="btn btn-ghost !px-3 !py-1.5 text-xs" disabled>← Prev</button>
    <span id="page-info" class="text-xs font-semibold text-slate-400">Page 1</span>
    <button id="btn-next" class="btn btn-ghost !px-3 !py-1.5 text-xs" disabled>Next →</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.body.dataset.page = "records";

const state = { page: 1, perPage: 12, date: "", cls: "", search: "" };

const els = {
  date: document.getElementById("filter-date"),
  cls: document.getElementById("filter-class"),
  search: document.getElementById("filter-search"),
  body: document.getElementById("records-body"),
  count: document.getElementById("record-count"),
  prev: document.getElementById("btn-prev"),
  next: document.getElementById("btn-next"),
  pageInfo: document.getElementById("page-info"),
  exportBtn: document.getElementById("btn-export"),
};

function statusBadge(s) {
  const map = {
    Present: "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400",
    Late: "bg-amber-500/10 text-amber-600 dark:text-amber-400",
  };
  return map[s] || map.Present;
}

function avatar(name, photo) {
  if (photo) return `<img src="${photo}" class="h-9 w-9 rounded-lg object-cover" alt="">`;
  return `<div class="grid h-9 w-9 place-items-center rounded-lg gradient-bg text-white text-xs font-bold">${App.escapeHtml((name || "?").charAt(0).toUpperCase())}</div>`;
}

async function loadRecords() {
  const params = new URLSearchParams();
  if (state.date) params.set("date", state.date);
  if (state.cls) params.set("class_section", state.cls);
  if (state.search) params.set("search", state.search);
  params.set("page", state.page);
  params.set("per_page", state.perPage);

  els.body.innerHTML = `<tr><td colspan="6" class="px-5 py-8"><div class="space-y-2">${"<div class='skeleton h-10'></div>".repeat(5)}</div></td></tr>`;

  try {
    const data = await App.apiFetch("/api/attendance?" + params.toString());
    const rows = data.records || [];
    els.count.textContent = `${data.total || 0} record${data.total === 1 ? "" : "s"}`;
    els.pageInfo.textContent = `Page ${data.page || 1} of ${data.pages || 1}`;
    els.prev.disabled = !(data.page > 1);
    els.next.disabled = !(data.page < data.pages);

    if (!rows.length) {
      els.body.innerHTML = `<tr><td colspan="6" class="px-5 py-14 text-center text-slate-400">
        <div class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-2xl bg-slate-100 dark:bg-slate-800">📄</div>
        No attendance records found.
      </td></tr>`;
      return;
    }
    els.body.innerHTML = rows.map((r) => {
      const s = r.student || {};
      return `<tr class="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 dark:border-slate-800/60 dark:hover:bg-slate-900/40 transition-colors">
        <td class="px-5 py-3"><div class="flex items-center gap-3">${avatar(s.name, s.photo_url)}<span class="font-semibold">${App.escapeHtml(s.name || "—")}</span></div></td>
        <td class="px-5 py-3 text-slate-500 dark:text-slate-400">${App.escapeHtml(s.roll_no || "—")}</td>
        <td class="px-5 py-3 text-slate-500 dark:text-slate-400">${App.escapeHtml(s.class_section || "—")}</td>
        <td class="px-5 py-3 tabular-nums">${App.escapeHtml(r.date)}</td>
        <td class="px-5 py-3 tabular-nums text-slate-500 dark:text-slate-400">${App.escapeHtml(r.time)}</td>
        <td class="px-5 py-3"><span class="rounded-full px-2.5 py-1 text-xs font-bold ${statusBadge(r.status)}">${App.escapeHtml(r.status)}</span></td>
      </tr>`;
    }).join("");
  } catch (err) {
    App.toast(err.message, "error");
  }
}

function buildExportUrl() {
  const p = new URLSearchParams();
  if (state.date) p.set("date", state.date);
  if (state.cls) p.set("class_section", state.cls);
  if (state.search) p.set("search", state.search);
  return "/api/attendance/export?" + p.toString();
}

/* Load class filter options */
(async function loadClasses() {
  try {
    const data = await App.apiFetch("/api/students");
    const classes = [...new Set(data.students.map((s) => s.class_section).filter(Boolean))].sort();
    classes.forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      els.cls.appendChild(opt);
    });
  } catch (_) {}
})();

els.date.addEventListener("change", () => { state.date = els.date.value; state.page = 1; loadRecords(); });
els.cls.addEventListener("change", () => { state.cls = els.cls.value; state.page = 1; loadRecords(); });
els.search.addEventListener("input", App.debounce(() => { state.search = els.search.value.trim(); state.page = 1; loadRecords(); }, 350));
els.prev.addEventListener("click", () => { state.page--; loadRecords(); });
els.next.addEventListener("click", () => { state.page++; loadRecords(); });
els.exportBtn.addEventListener("click", () => {
  App.toast("Preparing Excel export…", "info", 2000);
  window.open(buildExportUrl(), "_blank");
});

loadRecords();
</script>
{% endblock %}
